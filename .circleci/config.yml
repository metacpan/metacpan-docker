---
# Use the latest 2.1 version of CircleCI pipeline process engine. See:
# https://circleci.com/docs/2.0/configuration-reference
version: 2.1
# Orchestrate or schedule a set of jobs
workflows:
  docker-compose:
    jobs:
      - build-and-test
jobs:
  build-and-test:
    machine: true
    resource_class: large
    steps:
      - checkout
      - run:
          command: |
            ./bin/metacpan-docker init
          name: clone missing repositories

      - run:
          name: docker compose build
          command: |
            docker compose --profile test build api-test

      - run:
          name: run tests
          command: |
            docker compose --profile test run api-test prove -lr -j4 t

      - run:
          name: Show Docker container logs on Error
          command: |
            docker-compose --profile test logs
            docker stats --no-stream
            docker ps -a | head
          when: on_fail
